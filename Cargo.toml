[package]
name = "doer-tui"
version = "0.1.0"
edition = "2021"
description = "A fast, keyboard-driven terminal user interface for Doer task & checklist manager"
license = "MIT"

[lib]
name = "doer_tui"
path = "src/lib.rs"

[[bin]]
name = "doer-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
unicode-width = "0.1"
arboard = "3"
tempfile = "3"
